<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive MapLibre map centered on the Bronx, New York." />
  <title>DDRR Bronx Map</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=bronx-search-layout" />
</head>
<body>
  <div id="app">
    <aside id="controlPanel" class="basemap-control control-panel" aria-label="Map controls">
      <header class="panel-header">
        <button id="panelCloseBtn" class="panel-close-btn" type="button" aria-label="Close controls">✕</button>
      </header>

      <fieldset class="layer-control">
        <legend>Layers</legend>
        <label>
          <input id="toggleSightings" type="checkbox" checked />
          <span class="legend-dot" aria-hidden="true"></span>
          <span>Confirmed ICE Sightings</span>
        </label>
        <label>
          <input id="toggleSubway" type="checkbox" />
          <span class="legend-dot legend-dot-subway" aria-hidden="true"></span>
          <span>Subway Stops</span>
        </label>
        <label>
          <input id="toggleSchools" type="checkbox" />
          <span class="legend-dot legend-dot-schools" aria-hidden="true"></span>
          <span>Schools</span>
        </label>
        <label>
          <input id="toggleBridgeLabels" type="checkbox" checked />
          <span class="legend-line legend-line-bridges" aria-hidden="true"></span>
          <span>Bridge names</span>
        </label>
        <div class="touch-row legend-parent-row" role="heading" aria-level="3">
          <label class="legend-parent-label">
            <input id="toggleNeighborhoods" type="checkbox" checked />
            <span class="legend-swatch legend-swatch-neighborhoods" aria-hidden="true"></span>
            <span>Neighborhoods</span>
          </label>
        </div>
        <div class="touch-subgroup" aria-label="Neighborhoods sublayers">
          <label class="touch-row touch-row-child">
            <input id="toggleNeighborhoodLabels" type="checkbox" checked />
            <span>Name Label</span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Basemap</legend>
        <label>
          <input type="radio" name="basemap" value="streets" checked />
          <span>Streets</span>
        </label>
        <label>
          <input type="radio" name="basemap" value="satellite" />
          <span>Satellite</span>
        </label>
      </fieldset>

      <section class="panel-section">
        <h2>Address / Cross-street</h2>
        <form id="searchForm" class="search-form">
          <label for="searchInput" class="sr-only">Search address or cross-streets</label>
          <div class="search-row">
            <input id="searchInput" type="text" placeholder="e.g. Main St & 1st Ave" autocomplete="off" required />
            <button type="submit">Search</button>
          </div>
        </form>
        <ul id="searchResults" class="search-results" aria-live="polite"></ul>
      </section>
    </aside>

    <button id="panelGrabTab" class="panel-grab-tab" type="button" aria-controls="controlPanel" aria-expanded="false"
      aria-label="Open controls panel">▶</button>

    <div id="map" aria-label="Interactive map of the Bronx"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="./main.js?v=bronx-search-layout" defer></script>
</body>
</html>
