<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive MapLibre map centered on the Bronx, New York." />
  <title>DDRR Bronx Map</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=b5b2048" />
</head>
<body>
  <div id="app">
    <div id="map" aria-label="Interactive map of the Bronx"></div>

    <section class="basemap-control" aria-label="Map controls">
      <fieldset class="layer-control">
        <legend>Layers</legend>
        <div class="touch-row legend-parent-row" role="heading" aria-level="3">
          <label class="legend-parent-label">
            <input id="toggleNeighborhoods" type="checkbox" checked />
            <span class="legend-swatch legend-swatch-neighborhoods" aria-hidden="true"></span>
            <span>Neighborhoods</span>
          </label>
        </div>
        <div class="touch-subgroup" aria-label="Neighborhoods sublayers">
          <label class="touch-row touch-row-child">
            <input id="toggleNeighborhoodLabels" type="checkbox" checked />
            <span>Name Label</span>
          </label>
        </div>
        <label>
          <input id="toggleSightings" type="checkbox" checked />
          <span class="legend-dot" aria-hidden="true"></span>
          <span>Confirmed ICE Sightings</span>
        </label>
        <label>
          <input id="toggleSchools" type="checkbox" />
          <span class="legend-dot legend-dot-schools" aria-hidden="true"></span>
          <span>Schools</span>
        </label>
        <label>
          <input id="toggleSubway" type="checkbox" checked />
          <span class="legend-dot legend-dot-subway" aria-hidden="true"></span>
          <span>Subway Stops</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Basemap</legend>
        <label>
          <input type="radio" name="basemap" value="streets" checked />
          <span>Streets</span>
        </label>
        <label>
          <input type="radio" name="basemap" value="satellite" />
          <span>Satellite</span>
        </label>
      </fieldset>
    </section>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="./main.js?v=1f4c09b" defer></script>
</body>
</html>
